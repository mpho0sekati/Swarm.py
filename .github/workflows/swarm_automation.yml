name: Swarm Automation

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight
  workflow_dispatch:
    inputs:
      prompt:
        description: 'The prompt for the swarm'
        required: true
        default: 'Analyze the safety and architecture of a microservices project.'

jobs:
  run-swarm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install groq

      - name: Run Ant-Safe Swarm
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          # Use input prompt if provided (manual run), else default
          PROMPT="${{ github.event.inputs.prompt || 'Optimize a Python script for performance.' }}"
          python ant_safe_swarm.py "$PROMPT"

      - name: Upload Swarm Report
        uses: actions/upload-artifact@v4
        with:
          name: swarm-report
          path: swarm_report.md
