<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Swarm Factory | Hive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #080808;
            color: #d4d4d4;
            font-family: 'JetBrains Mono', monospace;
        }
        .ant-swarm-canvas {
            background: radial-gradient(circle, #111 0%, #080808 100%);
            border: 1px solid #222;
        }
        .glass {
            background: rgba(15, 15, 15, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid #222;
        }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <header class="mb-8 flex justify-between items-end">
            <div>
                <h1 class="text-3xl font-bold text-green-400 tracking-tighter">🌑 DARK SWARM</h1>
                <p class="text-xs text-gray-500 uppercase tracking-widest">Autonomous Hive Intelligence</p>
            </div>
            <div id="connection-status" class="text-xs px-2 py-1 rounded bg-red-900/30 text-red-400 border border-red-500/50">DISCONNECTED</div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Control Panel -->
            <div class="space-y-6">
                <div class="glass p-6 rounded-xl">
                    <h3 class="text-sm font-bold text-gray-400 mb-4 uppercase">Launch Instructions</h3>
                    <textarea id="instructions" class="w-full h-40 bg-black border border-gray-800 rounded-lg p-3 text-sm focus:border-green-500 outline-none transition-all" placeholder="Describe the mission..."></textarea>

                    <div class="mt-4 space-y-4">
                        <div>
                            <label class="text-[10px] text-gray-500 uppercase">Provider Model</label>
                            <select id="model-select" class="w-full bg-black border border-gray-800 rounded p-2 text-xs">
                                <option>groq/llama-3.3-70b-versatile</option>
                                <option>openai/gpt-4o</option>
                                <option>anthropic/claude-3-5-sonnet</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-[10px] text-gray-500 uppercase">API Key (Groq/OpenAI/Anthropic)</label>
                            <input type="password" id="api-key" class="w-full bg-black border border-gray-800 rounded p-2 text-xs" placeholder="sk-...">
                        </div>
                    </div>

                    <button id="launch-btn" class="w-full mt-6 bg-green-900/20 text-green-400 border border-green-500/50 py-3 rounded-lg font-bold hover:bg-green-500 hover:text-black transition-all">
                        INITIATE SWARM
                    </button>
                </div>
            </div>

            <!-- Visualization Space -->
            <div class="lg:col-span-2 space-y-6">
                <div class="relative glass rounded-xl overflow-hidden h-[500px]">
                    <div class="absolute top-4 left-4 z-10">
                        <span class="text-[10px] bg-green-500/10 text-green-500 border border-green-500/20 px-2 py-1 rounded">LIVE HIVE FEED</span>
                    </div>
                    <canvas id="hiveCanvas" class="w-full h-full ant-swarm-canvas"></canvas>
                </div>

                <div class="glass p-4 rounded-xl h-48 overflow-y-auto" id="log-container">
                    <div class="text-[10px] text-gray-600 mb-2 uppercase">Sub-system Activity Logs</div>
                    <div id="logs" class="space-y-1 text-xs">
                        <div class="text-gray-500">[SYSTEM] Initializing hive modules...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('hiveCanvas');
        const ctx = canvas.getContext('2d');
        let ants = [];

        function resize() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Ant {
            constructor(id, role) {
                this.id = id;
                this.role = role;
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.targetX = Math.random() * canvas.width;
                this.targetY = Math.random() * canvas.height;
                this.size = 1.5;
                this.speed = 0.5 + Math.random() * 1.5;
                this.baseColor = '#4ade80';
                this.color = this.baseColor;
                this.trail = [];
                this.pulse = 0;
            }

            update() {
                this.trail.push({x: this.x, y: this.y});
                if(this.trail.length > 15) this.trail.shift();

                const dx = this.targetX - this.x;
                const dy = this.targetY - this.y;
                const dist = Math.sqrt(dx*dx + dy*dy);

                if(dist < 10) {
                    this.targetX = Math.random() * canvas.width;
                    this.targetY = Math.random() * canvas.height;
                } else {
                    this.x += (dx/dist) * this.speed + (Math.random() - 0.5);
                    this.y += (dy/dist) * this.speed + (Math.random() - 0.5);
                }

                if(this.pulse > 0) this.pulse -= 0.05;
            }

            draw() {
                ctx.strokeStyle = this.color + '33';
                ctx.beginPath();
                this.trail.forEach((p, i) => {
                    if(i===0) ctx.moveTo(p.x, p.y);
                    else ctx.lineTo(p.x, p.y);
                });
                ctx.stroke();

                ctx.fillStyle = this.color;
                const s = this.size + (this.pulse > 0 ? this.pulse * 3 : 0);
                ctx.beginPath();
                ctx.arc(this.x, this.y, s, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Initialize hive
        for(let i=0; i<40; i++) ants.push(new Ant(i, 'Worker'));

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ants.forEach(ant => {
                ant.update();
                ant.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();

        // WebSocket setup
        const clientId = Math.random().toString(36).substring(7);
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        // Note: For local dev we'd use localhost:8000
        const ws = new WebSocket(`${protocol}//${window.location.host}/ws/${clientId}`);

        ws.onopen = () => {
            document.getElementById('connection-status').innerText = 'CONNECTED';
            document.getElementById('connection-status').className = 'text-xs px-2 py-1 rounded bg-green-900/30 text-green-400 border border-green-500/50';
        };

        ws.onmessage = (event) => {
            const msg = JSON.parse(event.data);
            addLog(msg.type, typeof msg.data === 'string' ? msg.data : JSON.stringify(msg.data));

            if(msg.type === 'swarm_started') {
                ants.forEach(a => {
                    a.color = '#4ade80';
                    a.speed = 2.5;
                });
            } else if(msg.type === 'task_update') {
                ants.forEach(a => a.pulse = 1);
            } else if(msg.type === 'subswarm_spawned') {
                for(let i=0; i<8; i++) {
                    const ant = new Ant(Date.now(), 'Sub-Worker');
                    ant.color = '#60a5fa';
                    ant.speed = 3;
                    ants.push(ant);
                }
            } else if(msg.type === 'swarm_completed') {
                ants.forEach(a => {
                    a.color = '#fbbf24';
                    a.speed = 0.3;
                });
            } else if(msg.type === 'swarm_error') {
                ants.forEach(a => a.color = '#f87171');
            }
        };

        function addLog(type, content) {
            const logs = document.getElementById('logs');
            const div = document.createElement('div');
            div.innerHTML = `<span class="text-green-500">[${type.toUpperCase()}]</span> <span class="text-gray-400">${content}</span>`;
            logs.appendChild(div);
            document.getElementById('log-container').scrollTop = logs.scrollHeight;
        }

        document.getElementById('launch-btn').onclick = async () => {
            const instructions = document.getElementById('instructions').value;
            const model = document.getElementById('model-select').value;
            const apiKey = document.getElementById('api-key').value;

            if(!instructions || !apiKey) {
                alert("Instructions and API Key required.");
                return;
            }

            addLog('system', 'Dispatching launch request...');

            try {
                const res = await fetch('/launch', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        instructions,
                        model,
                        api_keys: {"key": apiKey}
                    })
                });
                const data = await res.json();
                addLog('system', `Swarm queued. ID: ${data.swarm_id}`);
            } catch (err) {
                addLog('error', err.message);
            }
        };
    </script>
</body>
</html>
